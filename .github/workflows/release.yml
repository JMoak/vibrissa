name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrapStable:
        description: Publish or repair stable 2.0.0 on latest; preserve the alpha channel
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      GIT_AUTHOR_NAME: Jordan Moak
      GIT_AUTHOR_EMAIL: jordan.moak@gmail.com
      GIT_COMMITTER_NAME: Jordan Moak
      GIT_COMMITTER_EMAIL: jordan.moak@gmail.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Node 24 includes npm with OIDC support. Do not set registry-url: its
      # placeholder NODE_AUTH_TOKEN configuration prevents tokenless publishing.
      - run: npm ci
      - name: Bootstrap the approved stable version
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrapStable
        run: node scripts/release.mjs bootstrap
        env:
          BOOTSTRAP_STABLE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the published stable baseline
        id: baseline
        if: github.event_name != 'workflow_dispatch' || !inputs.bootstrapStable
        run: node scripts/release.mjs check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # semantic-release internally tolerates note-fetch failures. Fail closed:
      # Release tags and channel notes are required to calculate the correct v2 version.
      - name: Fetch release channel history
        if: steps.baseline.outputs.ready == 'true' || (github.event_name == 'workflow_dispatch' && inputs.bootstrapStable)
        run: |
          git fetch origin '+refs/tags/v*:refs/tags/v*' '+refs/notes/semantic-release*:refs/notes/semantic-release*'
          git notes --ref=semantic-release-v2.0.0 show v2.0.0
      - name: Verify the automatic release baseline
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrapStable
        run: npm run release -- --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish conventional release commits
        if: steps.baseline.outputs.ready == 'true'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
